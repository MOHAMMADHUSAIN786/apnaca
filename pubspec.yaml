name: apnaca
description: "A new Flutter project."

version: 1.0.1+2

environment:
  sdk: ^3.8.0


dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.7
  pin_code_fields: ^8.0.0
  device_preview: ^1.2.0
  flutter_screenutil: ^5.9.3
  get: ^4.7.2
  file_picker: ^10.2.1

  #API PACKAGE
  http: ^1.2.0
  shared_preferences: ^2.2.2

  #LOADER
  flutter_spinkit: ^5.2.0

  #LOTTIE
  lottie: ^3.1.0

  # Firebase Core (must)
  firebase_core: ^4.9.0

  # Authentication (login/signup)
  firebase_auth: ^6.5.1

  # Optional (future use)
  cloud_firestore: ^6.4.1   # if needed later

  # Barcode scanner
  mobile_scanner: ^3.0.0
  # Drift (local offline DB)
  drift: ^2.9.0
  path_provider: ^2.0.15
  sqflite: ^2.2.8
  path: ^1.8.3
  flutter_dotenv: ^5.0.2
  image_picker: ^0.8.7+4
  pdf: ^3.9.0
  printing: ^5.9.0
  cloud_functions: ^6.3.1
  razorpay_flutter: ^1.3.8
  # sqlite3_flutter_libs: ^0.6.2  # optional native sqlite libs; enable if needed for your platform
  flutter_bloc: ^8.1.2
  equatable: ^2.0.5
  firebase_storage: ^13.4.2
  blue_thermal_printer: ^1.2.3
  share_plus: ^12.0.2
  speech_to_text: ^7.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.2.1
  test: ^1.22.0
  drift_dev: ^2.18.0
  build_runner: ^2.4.11



flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/ic_logo.svg"

flutter:

  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - .env
    - assets/images/
    - assets/lottie/


  fonts:
    - family: regular
      fonts:
        - asset: assets/fonts/regular.ttf

    - family: light
      fonts:
        - asset: assets/fonts/light.ttf

    - family: medium
      fonts:
        - asset: assets/fonts/medium.ttf

    - family: bold
      fonts:
        - asset: assets/fonts/bold.ttf


