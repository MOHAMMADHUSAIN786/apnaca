name: apnaca
description: "A new Flutter project."

version: 1.0.1+2

environment:
  sdk: ^3.8.0


dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.7
  flutter_lints: ^5.0.0
  pin_code_fields: ^8.0.0
  device_preview: ^1.2.0
  flutter_screenutil: ^5.9.3
  get: ^4.7.2
  file_picker: ^10.2.1

  #API PACKAGE
  http: ^1.2.0
  shared_preferences: ^2.2.2

  #LOADER
  flutter_spinkit: ^5.2.0

  #LOTTIE
  lottie: ^3.1.0

  # Firebase Core (must)
  firebase_core: ^4.9.0

  # Authentication (login/signup)
  firebase_auth: ^6.5.1

  # Optional (future use)
  cloud_firestore: ^6.4.1   # if needed later
  firebase_storage: ^13.2.0  # for files/images
  flutter_bloc: ^9.1.1
  equatable: ^2.0.8
  uuid: ^4.5.3
  dio: ^5.9.2
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  get_it: ^7.7.0
  logger: ^2.3.0
  path_provider: ^2.1.3
  flutter_dotenv: ^5.1.0
  sqflite: ^2.3.0
  path: ^1.8.3
  share_plus: ^10.0.0
  pdf: ^3.10.8
  image_picker: ^1.0.7
  razorpay_flutter: ^1.3.6
  speech_to_text: ^7.0.0
  intl: ^0.20.2


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1
  drift_dev: ^2.18.0
  build_runner: ^2.4.11



flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/ic_logo.png"

flutter:

  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - .env
    - assets/images/
    - assets/lottie/


  fonts:
    - family: regular
      fonts:
        - asset: assets/fonts/regular.ttf

    - family: light
      fonts:
        - asset: assets/fonts/light.ttf

    - family: medium
      fonts:
        - asset: assets/fonts/medium.ttf

    - family: bold
      fonts:
        - asset: assets/fonts/bold.ttf


